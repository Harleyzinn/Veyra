name: Veyra Finance Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: veyra-finance-pages
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install locked build dependencies
        run: npm ci --prefix apps/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Validate types and finance invariants
        run: |
          node apps/desktop/node_modules/typescript/bin/tsc -p apps/finance/tsconfig.json
          node apps/desktop/node_modules/tsx/dist/cli.mjs --test apps/finance/tests/domain.test.ts
      - run: node apps/finance/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/finance/out
      - uses: actions/deploy-pages@v4
        id: deployment
